name: Build All Platforms

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ============ Linux ============
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Linux
        run: flutter build linux --release

      - name: 打包为 tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../chusearchsong-linux-x64.tar.gz *

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chusearchsong-linux-x64
          path: chusearchsong-linux-x64.tar.gz

  # ============ macOS ============
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 macOS（无签名）
        run: flutter build macos --release
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: '-'

      - name: 创建 DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name "*.app" -print -quit)
          echo "找到应用: $APP_PATH"
          hdiutil create -volname "chusearchsong" -srcfolder "$APP_PATH" -ov -format UDZO chusearchsong-macos.dmg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chusearchsong-macos
          path: chusearchsong-macos.dmg

  # ============ Windows ============
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Windows
        run: flutter build windows --release

      - name: 打包为 zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath chusearchsong-windows-x64.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chusearchsong-windows-x64
          path: chusearchsong-windows-x64.zip

  # ============ iOS ============
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 iOS（无签名）
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r unsigned.ipa Payload/
          rm -rf Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chusearchsong-ios-unsigned
          path: build/ios/iphoneos/unsigned.ipa

  # ============ Android ============
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 创建签名文件
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/app/upload-keystore.jks

      - name: 构建 APK（分 ABI）
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE_PATH: upload-keystore.jks
        run: flutter build apk --release --split-per-abi

      - name: 构建 AAB
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE_PATH: upload-keystore.jks
        run: flutter build appbundle --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: chusearchsong-android-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: 上传 AAB
        uses: actions/upload-artifact@v4
        with:
          name: chusearchsong-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # ============ Web ============
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Web
        run: flutter build web --release

      - name: 修复 base href（适配部署子路径）
        run: sed -i 's|<base href="/">|<base href="./">|g' build/web/index.html

      - name: 创建 Netlify 配置文件
        run: |
          cat > build/web/_redirects << 'EOF'
          # SPA 路由重定向：所有路径都返回 index.html
          /*    /index.html   200
          EOF

          cat > build/web/_headers << 'EOF'
          # 静态资源缓存
          /assets/*
            Cache-Control: public, max-age=31536000, immutable

          /icons/*
            Cache-Control: public, max-age=31536000, immutable

          /canvaskit/*
            Cache-Control: public, max-age=31536000, immutable

          /*
            Cache-Control: no-cache
          EOF

          cat > build/web/netlify.toml << 'EOF'
          # Netlify 配置文件
          [[redirects]]
            from = "/*"
            to = "/index.html"
            status = 200

          [[headers]]
            for = "/assets/*"
            [headers.values]
              Cache-Control = "public, max-age=31536000, immutable"

          [[headers]]
            for = "/icons/*"
            [headers.values]
              Cache-Control = "public, max-age=31536000, immutable"

          [[headers]]
            for = "/canvaskit/*"
            [headers.values]
              Cache-Control = "public, max-age=31536000, immutable"

          [[headers]]
            for = "/*"
            [headers.values]
              Cache-Control = "no-cache"
              X-Frame-Options = "DENY"
              X-Content-Type-Options = "nosniff"
          EOF

          echo "已创建 _redirects、_headers、netlify.toml"

      - name: 打包为 zip
        run: |
          cd build/web
          zip -r ../../chusearchsong-web.zip .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chusearchsong-web
          path: chusearchsong-web.zip

      - name: 推送到 web-dist 分支
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: web-dist
          force_orphan: true

  # ============ 发布到 Release 草稿 ============
  release:
    needs: [build-linux, build-macos, build-windows, build-ios, build-android, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 GITHUB_TOKEN 创建/更新 Release
    if: github.event_name != 'pull_request'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出产物
        run: ls -R artifacts/

      - name: 提取版本号并重命名产物
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          echo "版本号: $VERSION"
          mkdir -p dist
          cp artifacts/chusearchsong-linux-x64/chusearchsong-linux-x64.tar.gz dist/chusearchsong-linux-x64-v${VERSION}.tar.gz
          cp artifacts/chusearchsong-macos/chusearchsong-macos.dmg dist/chusearchsong-macos-v${VERSION}.dmg
          cp artifacts/chusearchsong-windows-x64/chusearchsong-windows-x64.zip dist/chusearchsong-windows-x64-v${VERSION}.zip
          cp artifacts/chusearchsong-ios-unsigned/unsigned.ipa dist/chusearchsong-ios-unsigned-v${VERSION}.ipa
          for f in artifacts/chusearchsong-android-apk/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .apk)
            cp "$f" "dist/${base}-v${VERSION}.apk"
          done
          for f in artifacts/chusearchsong-android-aab/*.aab; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .aab)
            cp "$f" "dist/${base}-v${VERSION}.aab"
          done
          cp artifacts/chusearchsong-web/chusearchsong-web.zip dist/chusearchsong-web-v${VERSION}.zip
          echo "重命名后的产物:"
          ls -R dist/

      - name: 发布到 Release（草稿）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          draft: true
          files: dist/*
