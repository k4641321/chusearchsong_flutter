name: Build Flutter Web and Push to Branch

on:
  push:
    branches: [ main ]       # 当 main 分支有推送时触发
  workflow_dispatch:         # 也支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write         # 授权推送代码到分支（必须）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'   # 使用具体版本号，避免网络问题
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to branch (gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages   # 你想存放构建结果的分支名
          force_orphan: false         # 可选：每次清空分支历史，保持干净
          commit_message: "Deploy Flutter web build from commit ${{ github.sha }}"
