# .github/workflows/build-apk.yml
name: Flutter CI        # 工作流的名称
on:                     # 触发条件
  push:
    branches: [ main ]  # 当代码推送到 main 分支时触发
jobs:
  build-android-apk:    # 任务的ID
    runs-on: ubuntu-latest # 使用 Ubuntu 环境，速度快且免费
    steps:
      - uses: actions/checkout@v3  # 1️⃣ 拉取你的代码
      - uses: subosito/flutter-action@v2  # 2️⃣ 配置 Flutter 环境
        with:
          flutter-version: '3.24.0'  # 指定版本，'stable' 指最新稳定版
          channel: 'stable'
      - run: flutter pub get      # 3️⃣ 获取项目依赖
      #- run: flutter test         # (可选)运行测试，确保提交没问题[reference:0]
      - run: flutter build apk --release  # 4️⃣ 正式打包 APK
      - uses: actions/upload-artifact@v4  # 5️⃣ 上传产物
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
